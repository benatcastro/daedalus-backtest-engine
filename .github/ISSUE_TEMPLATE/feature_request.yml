name: 🚀 Feature Request
description: Suggest a new feature or enhancement for the Daedalus trading platform
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a feature for Daedalus! Please fill out the sections below to help us understand your request.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the platform does this feature relate to?
      options:
        - Frontend Dashboard
        - Backend API (Python/FastAPI)
        - User Management (Next.js)
        - Database Schema
        - Backtest Engine Integration
        - Data Visualization
        - Performance Analytics
        - CI/CD & DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve workflow
        - High - Critical for trading operations
        - Critical - Blocking current work
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Clearly describe the feature you'd like to see implemented
      placeholder: "I would like to see..."
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case / Trading Scenario
      description: Describe the trading scenario or workflow where this feature would be valuable
      placeholder: "As a quantitative trader, I need this feature because..."
    validations:
      required: true

  - type: textarea
    id: current-workaround
    attributes:
      label: Current Workaround
      description: How are you currently handling this without the feature?
      placeholder: "Currently I have to..."
    validations:
      required: false

  - type: dropdown
    id: backtest-engine
    attributes:
      label: Backtest Engine Relevance
      description: Is this feature specific to a particular backtest engine?
      options:
        - Lean Engine
        - Generic (all engines)
        - Future engine support
        - Not engine-specific
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What would make this feature complete? (Use checkboxes)
      placeholder: |
        - [ ] Feature should allow...
        - [ ] Users can...
        - [ ] System should validate...
    validations:
      required: false

  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical Considerations
      description: Any technical requirements, constraints, or suggestions?
      placeholder: "This might require changes to the database schema, API endpoints, etc."
    validations:
      required: false

  - type: checkboxes
    id: impact-areas
    attributes:
      label: Impact Areas
      description: Which areas might be affected by this feature?
      options:
        - label: Database schema changes
        - label: API modifications
        - label: Frontend UI/UX changes
        - label: Performance implications
        - label: Security considerations
        - label: Docker/deployment changes
        - label: Documentation updates

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to similar features, or any other relevant information
      placeholder: "Add any other context, screenshots, or examples here"
