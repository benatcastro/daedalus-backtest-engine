name: Format Check

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]

jobs:
  frontend-style:
    name: Frontend Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Prettier check
        working-directory: ./frontend
        run: npm run style:check .

  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: ./backtest-backend
        run: pip install -r cicd-requirements.txt

      - name: Format Check
        working-directory: ./backtest-backend
        run: ruff format --check

      - name: Linting Check
        working-directory: ./backtest-backend
        run: ruff check

