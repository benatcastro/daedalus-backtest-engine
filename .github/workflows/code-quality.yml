name: Code Quality

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]

jobs:
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Format check (frontend)
        run: npx nx style:check frontend

      # Linting is not yet enforced (pre-existing issues are being cleaned up).
      # Re-enable once the codebase is lint-clean:
      # - name: Lint (frontend)
      #   run: npx nx lint frontend

  backend-quality:
    name: Backend Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Ruff format check
        working-directory: ./apps/backtest-backend
        run: uvx ruff format --check .

      - name: Ruff lint check
        working-directory: ./apps/backtest-backend
        run: uvx ruff check .

  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check -p fin-data-manager
